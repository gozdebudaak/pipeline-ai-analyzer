services:
  api:
    build: .
    image: pipeline-ai-analyzer:dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # .env.example defaults are enough for MVP 0
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Read from .env (or the shell). Without a key the API starts but /ready reports 503.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    restart: unless-stopped
